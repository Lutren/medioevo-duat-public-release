<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">

  <defs>
    <radialGradient id="duatGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24E8FF" stop-opacity="0.42"/>
      <stop offset="42%" stop-color="#3E7BFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030911" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24E8FF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#071525" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#3E7BFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24E8FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3E7BFF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#24E8FF" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="#030911"/>
  <rect width="1024" height="1024" fill="url(#grid)" opacity=".45"/>
  <circle cx="512" cy="430" r="390" fill="url(#duatGlow)"/>
  <g transform="translate(178 160) scale(1.3)">
    <circle cx="256" cy="186" r="92" stroke="#24E8FF" stroke-width="18" filter="url(#softGlow)"/>
    <path d="M256 286V408" stroke="#24E8FF" stroke-width="18" stroke-linecap="round"/>
    <path d="M166 332H346" stroke="#24E8FF" stroke-width="18" stroke-linecap="round"/>
  </g>
  <text x="512" y="805" text-anchor="middle" font-family="Inter,Arial" font-size="118" font-weight="900" fill="#F4FBFF" letter-spacing="16">DUAT</text>
  <text x="512" y="868" text-anchor="middle" font-family="Inter,Arial" font-size="32" font-weight="600" fill="#24E8FF">ADAPTIVE INTELLIGENCE DISPLAY</text>
</svg>