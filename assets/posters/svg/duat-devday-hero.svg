  <text x="80" y="180" font-family="Inter, Arial, sans-serif" font-size="150" font-weight="900" fill="#F4FBFF" letter-spacing="10">DUAT</text>
  <text x="88" y="245" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="600" fill="#24E8FF">Adaptive Intelligence Display</text>
  <text x="88" y="307" font-family="Inter, Arial, sans-serif" font-size="28" fill="#F4FBFF" opacity="0.88"><tspan x="88" y="307">A Cognitive Operating Surface for</tspan><tspan x="88" y="345">Structured AI Workflows</tspan></text>
  <path d="M88 385H650" stroke="url(#edge)" stroke-width="4"/>
  <text font-family="Inter, Arial, sans-serif" font-size="27" fill="#F4FBFF" opacity="0.92"><tspan x="88" y="446">DUAT is a cognitive display and</tspan><tspan x="88" y="483">orchestration layer for advanced AI</tspan><tspan x="88" y="519">work. It transforms fragmented</tspan><tspan x="88" y="556">information into structured, actionable</tspan><tspan x="88" y="593">systems by coordinating specialized</tspan><tspan x="88" y="630">agents, memory, geospatial context, and</tspan><tspan x="88" y="666">adaptive workflows in one unified</tspan><tspan x="88" y="703">environment. Designed for high-</tspan><tspan x="88" y="740">complexity operations, DUAT helps humans</tspan><tspan x="88" y="776">and AI work together with clarity,</tspan><tspan x="88" y="813">continuity, and precision.</tspan></text>
  <g transform="translate(88 812)"><g transform="translate(0 0)"><rect width="62" height="62" rx="14" fill="#071525" stroke="#24E8FF" stroke-opacity="0.7"/><circle cx="31" cy="31" r="13" stroke="#00F5D4" stroke-width="3"/><text x="84" y="38" font-family="Inter,Arial" font-size="27" fill="#F4FBFF">Multi-agent coordination</text></g><g transform="translate(0 80)"><rect width="62" height="62" rx="14" fill="#071525" stroke="#24E8FF" stroke-opacity="0.7"/><circle cx="31" cy="31" r="13" stroke="#00F5D4" stroke-width="3"/><text x="84" y="38" font-family="Inter,Arial" font-size="27" fill="#F4FBFF">Persistent memory and context</text></g><g transform="translate(0 160)"><rect width="62" height="62" rx="14" fill="#071525" stroke="#24E8FF" stroke-opacity="0.7"/><circle cx="31" cy="31" r="13" stroke="#00F5D4" stroke-width="3"/><text x="84" y="38" font-family="Inter,Arial" font-size="27" fill="#F4FBFF">Geospatial and operational intelligence</text></g></g>
