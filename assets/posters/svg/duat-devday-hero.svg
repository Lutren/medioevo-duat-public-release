    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#24E8FF" stop-opacity="0.25"/><stop offset="50%" stop-color="#00F5D4" stop-opacity="0.9"/><stop offset="100%" stop-color="#3E7BFF" stop-opacity="0.25"/></linearGradient>
