<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">

  <defs>
    <radialGradient id="duatGlow" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#24E8FF" stop-opacity="0.42"/><stop offset="42%" stop-color="#3E7BFF" stop-opacity="0.12"/><stop offset="100%" stop-color="#030911" stop-opacity="0"/></radialGradient>
