      <stop offset="0%" stop-color="#24E8FF" stop-opacity="0.42"/>
      <stop offset="42%" stop-color="#3E7BFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030911" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24E8FF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#071525" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#3E7BFF" stop-opacity="0.2"/>
